[project]
name = "target-workday"
version = "0.1.0"
description = "Hotglue Singer target for create-only Workday Finance SOAP accounting journals"
requires-python = ">=3.10,<3.11"
dependencies = [
    "hotglue-singer-sdk==1.0.53",
    "requests>=2.32,<3",
    "urllib3>=2,<3",
    "defusedxml>=0.7.1,<0.8",
    "jsonschema>=3.2,<4",
]

[project.scripts]
target-workday = "target_workday.target:TargetWorkday.cli"

[dependency-groups]
dev = ["pytest>=8,<10", "responses>=0.25,<0.27", "ruff>=0.15"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [".secrets"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
